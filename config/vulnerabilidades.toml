# Vulnerabilidades conhecidas (CVE) dos programas vigiados. A plataforma compara a versao que o
# agente le em cada container com esta lista e gera evento VULNERABILIDADE (com e-mail).
#
# Campos: servico, programa, cve, corrigido_em (primeira versao sem a falha), nivel (ATENCAO/CRITICO),
# descricao, fonte. Opcionais: afeta_desde (falha so a partir desta versao) e ramo (a correcao vale so
# para esse ramo, ex.: "3.8"). Conferido nas fontes em 23/11/2026; atualize quando sair falha nova.
#
# Limite conhecido: a comparacao e por numero de versao. Distribuicoes (Debian, Alpine) as vezes
# corrigem a falha sem trocar o numero ("backport"); nesse caso o aviso e um falso positivo e deve
# ser conferido no aviso de seguranca da distribuicao (ver docs/playbooks/seguranca-vulnerabilidade.md).

[[vulnerabilidade]]
servico = "web"
programa = "apache"
cve = "CVE-2024-38476"
