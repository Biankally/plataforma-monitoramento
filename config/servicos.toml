# Enderecos dos servicos vigiados (containers do servicos/docker-compose.yml).
# Portas alternativas para nao conflitar com o XAMPP (80 e 3306) e com o Windows (53 e 25).
[plataforma]
api_url = "http://127.0.0.1:5000"
intervalo_s = 15

[[servico]]
nome = "web"
tipo = "http"
url = "http://127.0.0.1:8080/"

[[servico]]
nome = "db"
tipo = "tcp"
host = "127.0.0.1"
porta = 3307

[[servico]]
nome = "dns"
tipo = "tcp"
host = "127.0.0.1"
porta = 1053

[[servico]]
nome = "smtp"
tipo = "tcp"
host = "127.0.0.1"
porta = 2525
