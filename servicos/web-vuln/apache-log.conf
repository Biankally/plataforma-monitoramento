# Uma linha por requisicao: codigo HTTP e tempo que o servidor levou (microssegundos, %D).
# Ex.: "200 1830". O agente (servicos/agente) le este arquivo pela pasta servicos/logs/web.
# GlobalLog (e nao CustomLog): o site padrao da imagem (000-default) tem o proprio CustomLog,
# e um CustomLog aqui fora seria ignorado para as requisicoes dele.
LogFormat "%>s %D" monitor
GlobalLog /var/log/app/acesso.log monitor
