# DNS de laboratorio. Exposto so em 127.0.0.1 pelo docker-compose.
server:
  interface: 0.0.0.0
  port: 53
  do-ip6: no
  access-control: 0.0.0.0/0 allow
  chroot: ""
  do-daemonize: no
  use-syslog: no
  logfile: ""
  verbosity: 1
  extended-statistics: yes
  statistics-cumulative: yes
  local-zone: "lab.local." static
  local-data: "teste.lab.local. IN A 192.0.2.10"

remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no
