# Servicos vigiados pela plataforma (P1). Cada um tem teto de CPU, memoria e processos:
# um ataque ao "web" bate no teto dele e nao derruba os outros (regra da professora).
# Portas publicadas so em 127.0.0.1: nada fica exposto na rede da faculdade.
# Subir:  docker compose up -d --build     (rodar dentro da pasta servicos/)
name: monitoramento

services:
  web:                               # site Receitas Praticas (alvo dos ataques)
    build: ./web-vuln
    ports: ["127.0.0.1:8080:80"]
    environment:
      DB_HOST: db
      DB_NAME: cadastro_db
      DB_USER: ${SITE_DB_USUARIO:-site}
      DB_PASS: ${SITE_DB_SENHA:?defina SITE_DB_SENHA no servicos/.env}
      MAIL_HOST: smtp
      MAIL_PORT: "25"
      MAIL_FROM: nao-responda@lab.local
      LOGIN_LOG: /var/log/app/login.log
    volumes:
      - "./web-vuln/site:/var/www/html/receitas_práticas:ro"
      - "./logs/web:/var/log/app"      # login.log e acesso.log; o agente le desta pasta
    depends_on: [db, smtp]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no servicos/.env}
      MYSQL_DATABASE: cadastro_db
      MYSQL_USER: ${SITE_DB_USUARIO:-site}          # usuario do site (nao e root)
      MYSQL_PASSWORD: ${SITE_DB_SENHA:?defina SITE_DB_SENHA no servicos/.env}
      MONITOR_DB_SENHA: ${MONITOR_DB_SENHA:?defina MONITOR_DB_SENHA no servicos/.env}
    volumes:
      - "db_dados:/var/lib/mysql"
      - "./banco:/docker-entrypoint-initdb.d:ro"   # init.sql e 02-monitor.sh: so na 1a subida
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 300
    restart: unless-stopped

  dns:
    build: ./dns
    ports: ["127.0.0.1:1053:53/udp", "127.0.0.1:1053:53/tcp"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped

  smtp:
    build: ./smtp
    ports: ["127.0.0.1:2525:25"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    restart: unless-stopped

volumes:
  db_dados:
